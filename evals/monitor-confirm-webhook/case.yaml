schema_version: "1.0"
name: monitor-confirm-webhook
prompt: |
  Set up monitoring for https://example.com/pricing so I'm alerted whenever the
  price changes. Pick whatever schedule makes sense.
execution:
  prompt: |
    Set up monitoring for https://example.com/pricing so I'm alerted whenever the
    price changes. Pick whatever schedule makes sense.
  max_turns: 8
  timeout_seconds: 120
graders:
  - type: llm
    name: confirm-and-webhook
    criteria: >-
      Before `flowda_watch_create` (or any schedule change), the assistant must
      have sent a user-visible message stating the per-check credit cost (about 1
      credit; 1/3/5 when the fetch runs) and the expected checks per day for the
      chosen schedule (for example, hourly is about 24 checks/day), then asked for
      confirmation and stopped. Creating the job without that pre-call cost
      message, or mentioning cost only afterwards, is a fail. It also asks whether
      the user has a public webhook URL that can receive callbacks (absolute
      http/https URL on a public host, port 80 or 443) or would rather poll with
      the check-history tools. It does not claim a monitoring job was created
      unless the user confirmed. Creating the job silently, or defaulting to a
      webhook the user never provided, is a fail.
