schema_version: "1.0"
name: template-list-get-run
prompt: |
  I need structured product data for Amazon ASIN B0D1XYZ123. Walk me through
  exactly how to get it with the flowda template tools, in the right order.
execution:
  prompt: |
    I need structured product data for Amazon ASIN B0D1XYZ123. Walk me through
    exactly how to get it with the flowda template tools, in the right order.
  max_turns: 8
  timeout_seconds: 120
graders:
  - type: llm
    name: list-get-run
    criteria: >-
      Before the first `flowda_template` call, the assistant must have sent a
      user-visible message stating that the execution costs 5 credits (and that an
      empty result is still billed) and stopped for the user's go-ahead.
      Mentioning credits only after the run, or making no pre-call cost message, is
      a fail. The final answer follows the catalogue flow: first
      `flowda_templates_list` to see the callable templates, then
      `flowda_templates_get` for the chosen template to read its input schema
      (which keys `params` accepts), then `flowda_template` with
      `template: amazon_product` and `params` containing the ASIN. It never
      proposes hand-written CSS selectors, extract options or guessing the params
      shape, and it identifies the template by its published id. Running
      `flowda_template` first without list/get, or inventing selectors, is a fail.
